apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage
  namespace: homepage
  labels:
    app.kubernetes.io/name: homepage
data:
  kubernetes.yaml: |
    mode: cluster

  settings.yaml: |
    title: Sirasith Homelab
    theme: dark
    color: slate
    headerStyle: clean
    statusStyle: dot
    useEqualHeights: true
    hideVersion: true
    layout:
      Applications:
        style: row
        columns: 4
      Cluster Management:
        style: row
        columns: 4
      Observability:
        style: row
        columns: 3
      Storage:
        style: row
        columns: 3

  custom.css: |
    :root {
      --color-primary: 125 211 252;
    }

    body {
      background:
        radial-gradient(circle at 10% 0%, rgba(56, 189, 248, 0.16), transparent 32rem),
        radial-gradient(circle at 90% 10%, rgba(129, 140, 248, 0.14), transparent 30rem),
        #111827;
    }

    #page_container {
      background: transparent;
    }

    .group-title {
      margin-top: 1.5rem;
      color: rgb(226 232 240);
      font-weight: 700;
      letter-spacing: 0.02em;
    }

    .service-card,
    .bookmark {
      border: 1px solid rgba(148, 163, 184, 0.16);
      border-radius: 0.9rem;
      background: rgba(30, 41, 59, 0.78);
      box-shadow: 0 10px 30px rgba(2, 6, 23, 0.18);
      backdrop-filter: blur(10px);
      transition: transform 160ms ease, border-color 160ms ease, box-shadow 160ms ease;
    }

    .service-card:hover,
    .bookmark:hover {
      transform: translateY(-3px);
      border-color: rgba(125, 211, 252, 0.55);
      box-shadow: 0 14px 34px rgba(2, 6, 23, 0.34);
    }

    .service-card-title,
    .bookmark-title {
      font-weight: 600;
    }

    .service-card-description {
      color: rgb(148 163 184);
    }

    .widget-container {
      border: 1px solid rgba(148, 163, 184, 0.14);
      border-radius: 0.9rem;
      background: rgba(15, 23, 42, 0.52);
      box-shadow: 0 8px 24px rgba(2, 6, 23, 0.14);
    }

  custom.js: ""

  bookmarks.yaml: |
    - Homelab:
      - Proxmox:
          - abbr: PX
            href: https://proxmox.home.sirasith.net:8006
      - Kubernetes:
          - abbr: K8S
            href: https://kubernetes.io/docs/home/
    - Developer:
        - GitHub:
            - abbr: GH
              href: https://github.com/dragonfore4
        - Argo CD:
            - abbr: CD
              href: https://argocd.home.sirasith.net

  services.yaml: |
    []

  widgets.yaml: |
    - greeting:
        text_size: xl
        text: Sirasith's Homelab
    - datetime:
        text_size: xl
        format:
          dateStyle: long
          timeStyle: short
          hour12: false
    - kubernetes:
        cluster:
          show: true
          cpu: true
          memory: true
          showLabel: true
          label: cluster
        nodes:
          show: true
          cpu: true
          memory: true
          showLabel: true
    - resources:
        backend: resources
        expanded: true
        cpu: true
        memory: true
        network: default
    - search:
        provider: duckduckgo
        target: _blank

  docker.yaml: ""

  proxmox.yaml: ""
