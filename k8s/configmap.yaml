apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage
  namespace: homepage
  labels:
    app.kubernetes.io/name: homepage
data:
  kubernetes.yaml: |
    mode: cluster

  settings.yaml: |
    title: Homelab
    theme: dark

  custom.css: ""

  custom.js: ""

  bookmarks.yaml: |
    - Homelab:
      - Proxmox:
          - abbr: PX
            href: https://proxmox.home.sirasith.net:8006
    - Developer:
        - GitHub:
            - abbr: GH
              href: https://github.com/dragonfore4

  services.yaml: |
    []

  widgets.yaml: |
    - kubernetes:
        cluster:
          show: true
          cpu: true
          memory: true
          showLabel: true
          label: cluster
        nodes:
          show: true
          cpu: true
          memory: true
          showLabel: true
    - resources:
        backend: resources
        expanded: true
        cpu: true
        memory: true
        network: default
    - search:
        provider: duckduckgo
        target: _blank

  docker.yaml: ""

  proxmox.yaml: ""
